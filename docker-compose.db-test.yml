# Only disposable Postgres. scripts/test-db.ts generates credentials and a unique project.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mktr_test
      POSTGRES_USER: mktr_test
      POSTGRES_PASSWORD: ${MKTR_DB_TEST_PASSWORD:?Generated by npm run test:db}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mktr_test -d mktr_test"]
      interval: 1s
      timeout: 3s
      retries: 30
