name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MKTR_TELEPHONY_MODE: simulated
      MKTR_CLASSIFIER_MODE: rules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg postgresql
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run test:media
      - run: npm run test:db
      - run: npm run test:backup
      - run: npm run test:e2e
      - name: Validate compose without starting telephony
        run: |
          docker compose config --quiet
          docker compose --profile live config --quiet
      - name: Build API and verify its runtime user
        run: |
          docker build -t mktr-voice-control:ci .
          test "$(docker run --rm mktr-voice-control:ci id -u)" != 0
      - name: Build media worker
        run: docker build -f media-worker/Dockerfile -t mktr-media-worker:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-artifacts
          path: |
            playwright-report/
            test-results/
            !test-results/**/auth-state*
            !test-results/.auth/**
          retention-days: 7
