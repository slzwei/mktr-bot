services:
  api:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${MKTR_API_PORT:-8787}:8787"
    environment:
      PORT: 8787
      NODE_ENV: production
      MKTR_WEB_ORIGIN: ${MKTR_WEB_ORIGIN:-https://localhost}
      MKTR_TRUST_PROXY: loopback,172.29.81.2
      MKTR_ADMIN_EMAIL: ${MKTR_ADMIN_EMAIL:-}
      MKTR_ADMIN_PASSWORD: ${MKTR_ADMIN_PASSWORD:-}
      MKTR_TELEPHONY_MODE: ${MKTR_TELEPHONY_MODE:-simulated}
      MKTR_MAX_CONCURRENT_CALLS: ${MKTR_MAX_CONCURRENT_CALLS:-5}
      MKTR_ORIGINATE_TIMEOUT_SECONDS: ${MKTR_ORIGINATE_TIMEOUT_SECONDS:-30}
      MKTR_MAX_CALL_SECONDS: ${MKTR_MAX_CALL_SECONDS:-180}
      MKTR_OUTCOME_WEBHOOK_ALLOWED_HOSTS: ${MKTR_OUTCOME_WEBHOOK_ALLOWED_HOSTS:-}
      MKTR_OUTCOME_WEBHOOK_SECRET: ${MKTR_OUTCOME_WEBHOOK_SECRET:-}
      MKTR_DNC_GATEWAY_URL: ${MKTR_DNC_GATEWAY_URL:-}
      MKTR_DNC_GATEWAY_SECRET: ${MKTR_DNC_GATEWAY_SECRET:-}
      MKTR_DNC_ENABLED: ${MKTR_DNC_ENABLED:-false}
      MKTR_INBOUND_CALLBACK_ENABLED: ${MKTR_INBOUND_CALLBACK_ENABLED:-false}
      MKTR_INBOUND_CLIP_FILE: ${MKTR_INBOUND_CLIP_FILE:-}
      MKTR_INBOUND_RECORD_MESSAGE: ${MKTR_INBOUND_RECORD_MESSAGE:-false}
      MKTR_INBOUND_MAX_MESSAGE_SECONDS: ${MKTR_INBOUND_MAX_MESSAGE_SECONDS:-60}
      MKTR_RECORDING_RETENTION_DAYS: ${MKTR_RECORDING_RETENTION_DAYS:-30}
      MKTR_RECORDING_STORAGE_DIR: /app/storage/recordings
      MKTR_CLIP_STORAGE_DIR: /app/storage/clips
      MKTR_RECORDING_ENABLED: ${MKTR_RECORDING_ENABLED:-false}
      MKTR_SINGTEL_SIP_HOST: sipsg01.b3networks.com
      MKTR_SINGTEL_SIP_IP: 52.77.0.62
      MKTR_SINGTEL_PCMA_PORT: 5061
      MKTR_SINGTEL_OPUS_PORT: 5081
      MKTR_SINGTEL_SIP_USERNAME: ${MKTR_SINGTEL_SIP_USERNAME:-sip69992409}
      MKTR_SINGTEL_SIP_PASSWORD: ${MKTR_SINGTEL_SIP_PASSWORD:-}
      MKTR_SINGTEL_CA_CERT_PATH: /run/secrets/singtel-ca
      MKTR_FREESWITCH_ESL_HOST: ${MKTR_FREESWITCH_ESL_HOST:-freeswitch}
      MKTR_FREESWITCH_ESL_PORT: 8021
      MKTR_FREESWITCH_ESL_PASSWORD: ${MKTR_FREESWITCH_ESL_PASSWORD:-}
      MKTR_MEDIA_GATEWAY_TOKEN: ${MKTR_MEDIA_GATEWAY_TOKEN:-}
      MKTR_MEDIA_WORKER_URL: ws://media-worker:8090
      MKTR_CLASSIFIER_MODE: ${MKTR_CLASSIFIER_MODE:-rules}
      MKTR_OPENAI_CLASSIFIER_MODEL: ${MKTR_OPENAI_CLASSIFIER_MODEL:-gpt-4o-mini}
      MKTR_CLASSIFIER_TIMEOUT_MS: ${MKTR_CLASSIFIER_TIMEOUT_MS:-1500}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://mktr:${MKTR_POSTGRES_PASSWORD:-}@postgres:5432/mktr
      REDIS_URL: redis://redis:6379/0
    volumes:
      - clip-data:/app/storage/clips
      - recording-data:/app/storage/recordings
      - ${MKTR_SINGTEL_CA_CERT_PATH:-./telephony/freeswitch/certs/CA_Certificate-2.pem}:/run/secrets/singtel-ca:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default: {}
      telephony:
        ipv4_address: 172.29.80.2
      proxy:
        ipv4_address: 172.29.81.3

  media-worker:
    build:
      context: .
      dockerfile: media-worker/Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      NODE_ENV: production
      MKTR_TELEPHONY_MODE: ${MKTR_TELEPHONY_MODE:-simulated}
      MKTR_MEDIA_WORKER_PORT: 8090
      MKTR_API_INTERNAL_URL: http://api:8787
      MKTR_MEDIA_GATEWAY_TOKEN: ${MKTR_MEDIA_GATEWAY_TOKEN:-}
      MKTR_STT_PROVIDER: ${MKTR_STT_PROVIDER:-deepgram}
      MKTR_STT_LANGUAGE: ${MKTR_STT_LANGUAGE:-en-SG}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      MKTR_PCM_CAPTURE_ENABLED: ${MKTR_PCM_CAPTURE_ENABLED:-false}
      MKTR_PCM_CAPTURE_DIR: /app/storage/pcm-capture
    volumes:
      - pcm-capture-data:/app/storage/pcm-capture
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      default: {}
      telephony:
        ipv4_address: 172.29.80.3
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    networks:
      proxy:
        ipv4_address: 172.29.81.2

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mktr
      POSTGRES_USER: mktr
      POSTGRES_PASSWORD: ${MKTR_POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mktr -d mktr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  freeswitch:
    image: mktr-freeswitch:1.11.3
    build:
      context: .
      dockerfile: telephony/freeswitch/Dockerfile
    profiles: ["live"]
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "5061:5061/tcp"
      - "10000-10199:10000-10199/udp"
    environment:
      MKTR_GATEWAY_PUBLIC_IP: ${MKTR_GATEWAY_PUBLIC_IP:-}
      MKTR_MAX_CONCURRENT_CALLS: ${MKTR_MAX_CONCURRENT_CALLS:-5}
      MKTR_MAX_CALL_SECONDS: ${MKTR_MAX_CALL_SECONDS:-180}
      MKTR_SINGTEL_INBOUND_IP: ${MKTR_SINGTEL_INBOUND_IP:-52.77.0.62}
      MKTR_INBOUND_CALLBACK_ENABLED: ${MKTR_INBOUND_CALLBACK_ENABLED:-false}
      MKTR_INBOUND_CLIP_FILE: ${MKTR_INBOUND_CLIP_FILE:-}
      MKTR_INBOUND_RECORD_MESSAGE: ${MKTR_INBOUND_RECORD_MESSAGE:-false}
      MKTR_INBOUND_MAX_MESSAGE_SECONDS: ${MKTR_INBOUND_MAX_MESSAGE_SECONDS:-60}
      MKTR_SINGTEL_SIP_USERNAME: ${MKTR_SINGTEL_SIP_USERNAME:-sip69992409}
      MKTR_SINGTEL_SIP_PASSWORD: ${MKTR_SINGTEL_SIP_PASSWORD:-}
      MKTR_SINGTEL_SIP_HOST: sipsg01.b3networks.com
      MKTR_SINGTEL_CA_CERT_PATH: /run/secrets/singtel-ca
      MKTR_FREESWITCH_TLS_PEM_PATH: /run/secrets/freeswitch-agent
      MKTR_FREESWITCH_BIND_IP: 172.29.80.4
      MKTR_API_TELEPHONY_IP: 172.29.80.2
      MKTR_MEDIA_WORKER_TELEPHONY_IP: 172.29.80.3
      MKTR_FREESWITCH_ESL_PASSWORD: ${MKTR_FREESWITCH_ESL_PASSWORD:-}
    networks:
      telephony:
        ipv4_address: 172.29.80.4
    volumes:
      - ./telephony/freeswitch/conf:/opt/mktr/freeswitch-conf:ro
      - ${MKTR_SINGTEL_CA_CERT_PATH:-./telephony/freeswitch/certs/cafile.pem}:/run/secrets/singtel-ca:ro
      - ${MKTR_FREESWITCH_TLS_PEM_PATH:-./telephony/freeswitch/certs/agent.pem}:/run/secrets/freeswitch-agent:ro
      - clip-data:/var/lib/freeswitch/recordings/mktr:ro
      - recording-data:/var/lib/freeswitch/recordings/sessions
      - freeswitch-db:/var/lib/freeswitch/db
    tmpfs:
      - /etc/freeswitch:uid=1000,gid=1000,mode=0700
      - /run/freeswitch:uid=1000,gid=1000,mode=0700
      - /var/log/freeswitch:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]

networks:
  default: {}
  telephony:
    ipam:
      config:
        - subnet: 172.29.80.0/24
  proxy:
    ipam:
      config:
        - subnet: 172.29.81.0/24

volumes:
  postgres-data:
  redis-data:
  clip-data:
  recording-data:
  pcm-capture-data:
  caddy-data:
  caddy-config:
  freeswitch-db:
